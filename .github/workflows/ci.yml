name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: compile scripts
        run: python -m py_compile skills/skill-generator/scripts/quick_validate.py tools/check_release.py
      - name: validate skill
        run: python skills/skill-generator/scripts/quick_validate.py skills/skill-generator
      - name: manifest versions and license copy in sync
        run: python tools/check_release.py
